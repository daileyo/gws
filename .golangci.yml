# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gosec
    - bodyclose
    - noctx
    - copyloopvar  # Replaces deprecated exportloopref

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false  # Allow blank identifier for intentionally ignored errors
  govet:
    enable-all: true
    disable:
      - fieldalignment  # Micro-optimization, not critical
  goimports:
    local-prefixes: github.com/daileyo/gws
  misspell:
    locale: US
  gosec:
    severity: medium
    confidence: medium

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - unparam
        - govet
    # Allow shadowing of err variable (common Go pattern)
    - linters:
        - govet
      text: 'shadow: declaration of "err"'
  max-issues-per-linter: 50
  max-same-issues: 10
