# GoReleaser configuration
# https://goreleaser.com/customization/

version: 2

project_name: git-workspace

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: git-workspace
    main: ./cmd/git-workspace
    binary: git-workspace
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: git-workspace-archive
    builds:
      - git-workspace
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

brews:
  - name: git-workspace
    repository:
      owner: daileyo
      name: homebrew-gws
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Formula
    homepage: "https://github.com/daileyo/gws"
    description: "A lightweight CLI tool for discovering, organizing, and navigating git repositories"
    license: "Apache-2.0"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: daileyo
    name: gws
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## git-workspace {{ .Tag }}

    Cross-platform CLI tool for discovering, organizing, and navigating git repositories.
  footer: |
    ---

    **Full Changelog**: https://github.com/daileyo/gws/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Installation

    Download the appropriate binary for your platform and add it to your PATH.

    **Linux/macOS:**

    ```bash
    tar -xzf git-workspace_{{ .Version }}_<os>_<arch>.tar.gz
    mkdir -p ~/.local/bin
    mv git-workspace ~/.local/bin/
    eval "$(git-workspace shell-init zsh)"   # or: bash
    ```

    **Windows (PowerShell):**

    ```powershell
    Invoke-WebRequest -Uri "https://github.com/daileyo/gws/releases/download/{{ .Tag }}/git-workspace_{{ .Version }}_windows_amd64.zip" -OutFile "$env:TEMP\git-workspace.zip"
    New-Item -ItemType Directory -Force -Path "$HOME\.local\bin" | Out-Null
    Expand-Archive -Path "$env:TEMP\git-workspace.zip" -DestinationPath "$HOME\.local\bin" -Force
    Remove-Item "$env:TEMP\git-workspace.zip"
    ```

    Add to your PowerShell `$PROFILE`:

    ```powershell
    $env:Path = "$HOME\.local\bin;$env:Path"
    Invoke-Expression (& git-workspace shell-init powershell | Out-String)
    ```

announce:
  skip: true
