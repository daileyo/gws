site_name: git-workspace
site_url: https://daileyo.github.io/gws
docs_dir: docs/site
repo_url: https://github.com/daileyo/gws
repo_name: gws

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  logo: assets/images/gws-logo-nav.png
  favicon: assets/images/gws-logo-favicon.png
  font:
    text: Nunito
    code: JetBrains Mono

extra_css:
  - assets/css/custom.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Commands:
      - Core: commands-core.md
      - User Management: commands-user.md
      - Tagging: commands-tagging.md
      - Legacy Flags: commands-legacy.md
  - Shell Integration: shell-integration.md
  - Configuration: configuration.md
